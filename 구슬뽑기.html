/* ------------------------------------------------------------------
   구슬 뽑기 — 전자칠판/태블릿/휴대폰 공용 스타일
   글꼴은 기기에 이미 있는 한글 글꼴만 쓴다 (인터넷 없이도 또렷하게 보임)
   ------------------------------------------------------------------ */
:root {
  --font: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo',
          'Malgun Gothic', '맑은 고딕', 'Noto Sans KR', system-ui, sans-serif;

  --panel: rgba(255, 255, 255, 0.94);
  --panel-line: rgba(88, 74, 120, 0.14);
  --ink: #322c46;
  --ink-soft: #6d6485;
  --field: #f2f0fa;
  --field-line: #ded8f0;

  --accent: #ff7043;
  --accent-dark: #e85a2c;
  --mint: #23b39a;
  --mint-dark: #199481;
  --chip: #ffffff;
  --chip-on: #6c5ce7;

  --radius: 22px;
  --shadow: 0 14px 40px rgba(40, 28, 80, 0.22);
}

:root.dark {
  --panel: rgba(24, 27, 56, 0.94);
  --panel-line: rgba(255, 255, 255, 0.14);
  --ink: #f0efff;
  --ink-soft: #b3aed6;
  --field: #232748;
  --field-line: #3b4070;
  --chip: #2b3059;
  --shadow: 0 14px 40px rgba(0, 0, 0, 0.5);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  font-family: var(--font);
  background: #0d1130;
  -webkit-text-size-adjust: 100%;
}

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}

canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  touch-action: none;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}

/* ── 아이콘 ───────────────────────────────────────────── */
.icon {
  background: currentColor;
  mask-repeat: no-repeat; mask-position: center; mask-size: contain;
  -webkit-mask-repeat: no-repeat; -webkit-mask-position: center; -webkit-mask-size: contain;
  display: inline-block; width: 1.15em; height: 1.15em; vertical-align: -0.16em;
  flex: none;

/* ── 설정 패널 ────────────────────────────────────────── */
#settings {
  position: fixed;
  left: 16px; right: 16px; bottom: 16px;
  z-index: 20;
  display: flex;
  gap: 16px;
  align-items: stretch;

  padding: 16px;
  border-radius: var(--radius);
  background: var(--panel);
  border: 1px solid var(--panel-line);
  box-shadow: var(--shadow);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);

  color: var(--ink);
  font-size: 17px;
  transition: opacity .35s ease, transform .35s ease, visibility .35s;
}
#settings.hide {
  opacity: 0; visibility: hidden; transform: translateY(24px);
}

.col-names { flex: 1 1 46%; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.col-opts  { flex: 1 1 54%; min-width: 0; display: flex; flex-direction: column; gap: 10px; }

.col-head {
  display: flex; align-items: center; gap: 10px;
  font-weight: 800; font-size: 18px; letter-spacing: -.01em;
}
.col-head .count {
  margin-left: auto;
  background: var(--chip-on); color: #fff;
  font-size: 15px; font-weight: 800;
  padding: 4px 12px; border-radius: 999px;
}

textarea#in_names {
  width: 100%;
  flex: 1 1 auto;
  min-height: 118px;
  resize: none;
  border-radius: 16px;
  border: 2px solid var(--field-line);
  background: var(--field);
  color: var(--ink);
  font-family: var(--font);
  font-size: 21px;
  font-weight: 600;
  line-height: 1.5;
  padding: 12px 14px;
  outline: none;
}
textarea#in_names:focus { border-color: var(--chip-on); }

.hint { font-size: 14px; color: var(--ink-soft); line-height: 1.5; }
.hint b { color: var(--ink); font-weight: 800; }

/* ── 설정 줄 ──────────────────────────────────────────── */
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row > .label {
  display: flex; align-items: center; gap: 7px;
  font-weight: 800; font-size: 16px;
  min-width: 96px; color: var(--ink-soft);
}

.chip {
  appearance: none; -webkit-appearance: none;
  font-family: var(--font); font-size: 16px; font-weight: 800;
  color: var(--ink);
  background: var(--chip);
  border: 2px solid var(--field-line);
  border-radius: 999px;
  padding: 9px 16px;
  min-height: 44px;
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 7px;
  transition: transform .12s ease, background .15s, border-color .15s, color .15s;
  white-space: nowrap;
}
.chip:hover { border-color: var(--chip-on); }
.chip:active { transform: scale(.96); }
.chip.active {
  background: var(--chip-on); border-color: var(--chip-on); color: #fff;
}

input#in_winningRank {
  width: 92px; min-height: 44px;
  font-family: var(--font); font-size: 17px; font-weight: 800; text-align: center;
  color: var(--ink); background: var(--chip);
  border: 2px solid var(--field-line); border-radius: 999px;
  padding: 8px 6px; outline: none;
}
input#in_winningRank.active { border-color: var(--chip-on); background: var(--chip-on); color: #fff; }

/* 토글 */
.toggle {
  display: inline-flex; align-items: center; gap: 9px;
  font-size: 16px; font-weight: 800; color: var(--ink);
  background: var(--chip);
  border: 2px solid var(--field-line);
  border-radius: 999px; padding: 8px 15px 8px 11px;
  min-height: 44px; cursor: pointer; user-select: none;
  transition: border-color .15s, background .15s;
}
.toggle input { position: absolute; opacity: 0; pointer-events: none; }
.toggle .sw {
  width: 42px; height: 24px; border-radius: 999px;
  background: #cfc9e4; position: relative; flex: none; transition: background .18s;
}
.toggle .sw::after {
  content: ''; position: absolute; top: 3px; left: 3px;
  width: 18px; height: 18px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3);
  transition: transform .18s;
}
.toggle.on { border-color: var(--chip-on); }
.toggle.on .sw { background: var(--chip-on); }
.toggle.on .sw::after { transform: translateX(18px); }

/* ── 큰 버튼 ──────────────────────────────────────────── */
.actions { display: flex; gap: 12px; margin-top: auto; }
.btn-big {
  flex: 1;
  appearance: none; border: none; cursor: pointer;
  font-family: var(--font); font-weight: 900; font-size: 22px; color: #fff;
  border-radius: 18px; min-height: 62px;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  box-shadow: 0 5px 0 rgba(0,0,0,.18);
  transition: transform .1s ease, box-shadow .1s ease, filter .15s;
}
.btn-big:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,.18); }
#btnShuffle { flex: 0 0 34%; background: var(--mint); }
#btnShuffle:hover { background: var(--mint-dark); }
#btnStart { background: var(--accent); font-size: 25px; }
#btnStart:hover { background: var(--accent-dark); }
#btnStart:disabled { background: #b9b4cc; box-shadow: 0 5px 0 rgba(0,0,0,.1); cursor: not-allowed; }

/* ── 우상단 작은 버튼 ─────────────────────────────────── */
.corner {
  position: fixed; top: 14px; right: 14px; z-index: 21;
  display: flex; gap: 8px;
}
.corner button {
  appearance: none; cursor: pointer;
  width: 46px; height: 46px; border-radius: 14px;
  border: 1px solid var(--panel-line);
  background: var(--panel); color: var(--ink);
  box-shadow: var(--shadow);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 19px;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  transition: transform .12s;
}
.corner button:active { transform: scale(.93); }

#btnReopen {
  position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
  z-index: 20;
  display: none;
  align-items: center; gap: 9px;
  padding: 14px 26px; border: none; border-radius: 999px;
  background: var(--panel); color: var(--ink);
  font-family: var(--font); font-size: 18px; font-weight: 800;
  box-shadow: var(--shadow); cursor: pointer;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
#settings.hide ~ #btnReopen { display: inline-flex; }

/* ── 안내 토스트 ──────────────────────────────────────── */
.toast {
  position: fixed; left: 50%; top: 24px; transform: translateX(-50%);
  z-index: 40;
  background: rgba(30, 24, 55, 0.94); color: #fff;
  font-size: 18px; font-weight: 700;
  padding: 13px 24px; border-radius: 999px;
  box-shadow: var(--shadow);
  animation: toastIn .22s ease;
}
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, -12px); } }

.credit {
  position: fixed; left: 14px; bottom: 4px; z-index: 5;
  font-size: 11px; color: rgba(255,255,255,.45);
  pointer-events: none;
}
:root:not(.dark) .credit { color: rgba(40,30,70,.42); }

/* ── 좁은 화면 (태블릿 세로 / 휴대폰) ─────────────────── */
@media (max-width: 900px) {
  #settings { flex-direction: column; left: 10px; right: 10px; bottom: 10px; padding: 13px; gap: 12px; }
  textarea#in_names { min-height: 84px; font-size: 19px; }
  .row > .label { min-width: 100%; }
  .btn-big { min-height: 56px; font-size: 20px; }
  #btnStart { font-size: 22px; }
  .opts-body.collapsed { display: none; }
}
@media (min-width: 901px) {
  #btnFold { display: none; }
  .opts-body.collapsed { display: flex; }
}
.opts-body { display: flex; flex-direction: column; gap: 10px; }

<body>
<h1 class="sr-only">구슬 뽑기 — 우리 반 추첨기</h1>

<div class="corner">
  <button id="btnFullscreen" title="전체 화면" aria-label="전체 화면">⛶</button>
</div>

<div id="settings" class="settings">
  <!-- 왼쪽: 이름 입력 -->
  <div class="col-names">
    <div class="col-head">
      <span>이름 입력</span>
      <span class="count" id="nameCount">0명</span>
    </div>
    <textarea id="in_names" spellcheck="false"
              placeholder="쉼표(,)나 줄바꿈으로 이름을 구분해 주세요">수박,키위,귤,딸기,포도,참외</textarea>
    <div class="hint">
      <b>이름*3</b> 은 구슬 3개, <b>이름/5</b> 는 당첨 확률을 높입니다 ·
      순위표를 <b>두 번 누르면</b> 전체 결과가 복사돼요
    </div>
  </div>

  <!-- 오른쪽: 설정 -->
  <div class="col-opts">
    <div class="row">
      <span class="label"><i class="icon map"></i>맵 고르기</span>
      <span id="mapButtons" style="display:flex;gap:8px;flex-wrap:wrap;"></span>
      <button id="btnFold" class="chip" style="margin-left:auto;">설정 접기</button>
    </div>

    <div class="opts-body" id="optsBody">
      <div class="row">
        <span class="label"><i class="icon trophy"></i>당첨 순위</span>
        <button class="chip btn-first-winner active">1등</button>
        <button class="chip btn-last-winner">꼴찌</button>
        <input type="number" id="in_winningRank" value="1" min="1" title="직접 순위 입력">
      </div>

      <div class="row">
        <label class="toggle" title="구슬을 귀여운 동물 캐릭터로 보여줍니다">
          <input type="checkbox" id="chkCharacters" checked><span class="sw"></span>캐릭터 구슬
        </label>
        <label class="toggle" title="배경 그림을 켜고 끕니다">
          <input type="checkbox" id="chkBackground" checked><span class="sw"></span>배경 그림
        </label>
        <label class="toggle" title="구슬끼리 가끔 서로 밀쳐냅니다">
          <input type="checkbox" id="chkSkill" checked><span class="sw"></span><i class="icon bomb"></i>충돌 스킬
        </label>
        <label class="toggle" title="경기 장면을 영상 파일로 저장합니다">
          <input type="checkbox" id="chkAutoRecording"><span class="sw"></span><i class="icon record"></i>영상 저장
        </label>
        <label class="toggle" title="밝은 화면 / 어두운 화면">
          <input type="checkbox" id="chkDarkMode" checked><span class="sw"></span><i class="icon moon"></i>어두운 화면
        </label>
      </div>
    </div>

    <div class="actions">
      <button id="btnShuffle" class="btn-big"><i class="icon shuffle"></i>섞기</button>
      <button id="btnStart" class="btn-big"><i class="icon play"></i>출발!</button>
    </div>
  </div>
</div>

<button id="btnReopen"><i class="icon gear"></i>설정 열기</button>

<script type="text/javascript">
  (function () {
    'use strict';

    var ready = false;
    var winnerType = 'first';

    function getNames() {
      var value = document.querySelector('#in_names').value.trim();
      return value.split(/[,\r\n]/g).map(function (v) { return v.trim(); }).filter(Boolean);
    }

    function parseName(nameStr) {
      var weightRegex = /(\/\d+)/;
      var countRegex = /(\*\d+)/;
      var hasWeight = weightRegex.test(nameStr);
      var hasCount = countRegex.test(nameStr);
      var m = /^\s*([^\/*]+)?/.exec(nameStr);
      return {
        name: m ? m[1] : '',
        weight: hasWeight ? parseInt(weightRegex.exec(nameStr)[1].replace('/', ''), 10) : 1,
        count: hasCount ? parseInt(countRegex.exec(nameStr)[1].replace('*', ''), 10) : 1
      };
    }

    function getReady() {
      var names = getNames();
      window.roulette.setMarbles(names);
      ready = names.length > 0;

      var total = window.roulette.getCount();
      document.querySelector('#nameCount').textContent = total + '명';
      document.querySelector('#btnStart').disabled = !ready;

      localStorage.setItem('mbr_names', names.join(','));

      if (winnerType === 'first') setWinnerRank(1);
      else if (winnerType === 'last') setWinnerRank(Math.max(1, total));
    }

    function setWinnerRank(rank) {
      document.querySelector('#in_winningRank').value = rank;
      window.options.winningRank = rank - 1;
      window.roulette.setWinningRank(window.options.winningRank);

      document.querySelector('.btn-first-winner').classList.toggle('active', winnerType === 'first');
      document.querySelector('.btn-last-winner').classList.toggle('active', winnerType === 'last');
      document.querySelector('#in_winningRank').classList.toggle('active', winnerType === 'custom');
    }

    function simpleToast(msg) {
      var toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = msg;
      if (window.translateElement) {
        toast.setAttribute('data-trans', '');
        window.translateElement(toast);
      }
      document.body.appendChild(toast);
      setTimeout(function () { toast.remove(); }, 1400);
    }

    function applyTheme(isDark) {
      window.options.darkMode = isDark;
      window.roulette.setTheme(isDark ? 'dark' : 'light');
      document.documentElement.classList.toggle('dark', isDark);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', isDark ? '#0d1130' : '#e6f2ff');
      localStorage.setItem('mbr_dark', isDark ? '1' : '0');
    }

    function paintToggle(el) {
      var label = el.closest('.toggle');
      if (label) label.classList.toggle('on', el.checked);
    }
    function restore(key, el, fallback) {
      var v = localStorage.getItem(key);
      el.checked = v === null ? fallback : v === '1';
      paintToggle(el);
      return el.checked;
    }
    function persist(key, el) {
      el.addEventListener('change', function () {
        paintToggle(el);
        localStorage.setItem(key, el.checked ? '1' : '0');
      });
    }

    function initialize() {
      if (!window.roulette || !window.roulette.isReady) {
        setTimeout(initialize, 100);
        return;
      }

      // ── 이름 ──────────────────────────────────────────
      var namesFromUrl = new URLSearchParams(window.location.search).get('names');
      if (namesFromUrl) {
        document.querySelector('#in_names').value = namesFromUrl.replace(/,/g, '\n');
      } else {
        var saved = localStorage.getItem('mbr_names');
        if (saved) document.querySelector('#in_names').value = saved;
      }

      document.querySelector('#in_names').addEventListener('input', getReady);
      document.querySelector('#in_names').addEventListener('blur', function () {
        var nameSet = new Set();
        var nameCounts = {};
        getNames().forEach(function (src) {
          var n = parseName(src);
          var key = n.weight > 1 ? n.name + '/' + n.weight : n.name;
          if (!nameSet.has(key)) { nameSet.add(key); nameCounts[key] = 0; }
          nameCounts[key] += n.count;
        });
        var result = Object.keys(nameCounts).map(function (key) {
          return nameCounts[key] > 1 ? key + '*' + nameCounts[key] : key;
        });
        var el = document.querySelector('#in_names');
        var newValue = result.join(',');
        if (el.value !== newValue) { el.value = newValue; getReady(); }
      });

      // ── 맵 버튼 ───────────────────────────────────────
      var mapWrap = document.querySelector('#mapButtons');
      var savedMap = parseInt(localStorage.getItem('mbr_map') || '0', 10) || 0;
      window.roulette.getMaps().forEach(function (map) {
        var b = document.createElement('button');
        b.className = 'chip map-btn';
        b.textContent = map.title;
        b.setAttribute('data-trans', '');
        if (window.translateElement) window.translateElement(b);
        b.addEventListener('click', function () {
          window.roulette.setMap(map.index);
          localStorage.setItem('mbr_map', String(map.index));
          mapWrap.querySelectorAll('.map-btn').forEach(function (o) { o.classList.remove('active'); });
          b.classList.add('active');
          getReady();
        });
        mapWrap.appendChild(b);
      });
      var mapBtns = mapWrap.querySelectorAll('.map-btn');
      if (mapBtns[savedMap]) mapBtns[savedMap].click();
      else if (mapBtns[0]) mapBtns[0].classList.add('active');

      // ── 버튼 ──────────────────────────────────────────
      document.querySelector('#btnShuffle').addEventListener('click', function () {
        getReady();
        simpleToast('구슬을 섞었어요');
      });

      document.querySelector('#btnStart').addEventListener('click', function () {
        if (!ready) return;
        document.querySelector('#settings').classList.add('hide');
        window.roulette.start();
      });

      document.querySelector('#btnReopen').addEventListener('click', function () {
        document.querySelector('#settings').classList.remove('hide');
      });

      var optsBody = document.querySelector('#optsBody');
      document.querySelector('#btnFold').addEventListener('click', function (e) {
        var folded = optsBody.classList.toggle('collapsed');
        e.target.textContent = folded ? '설정 펴기' : '설정 접기';
      });

      document.querySelector('#btnFullscreen').addEventListener('click', function () {
        if (document.fullscreenElement) document.exitFullscreen();
        else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
      });

      // ── 순위 ──────────────────────────────────────────
      document.querySelector('#in_winningRank').addEventListener('change', function (e) {
        var v = parseInt(e.target.value, 10);
        winnerType = 'custom';
        setWinnerRank(isNaN(v) || v < 1 ? 1 : v);
      });
      document.querySelector('.btn-last-winner').addEventListener('click', function () {
        winnerType = 'last';
        setWinnerRank(Math.max(1, window.roulette.getCount()));
      });
      document.querySelector('.btn-first-winner').addEventListener('click', function () {
        winnerType = 'first';
        setWinnerRank(1);
      });

      // ── 토글 ──────────────────────────────────────────
      var chkSkill = document.querySelector('#chkSkill');
      window.options.useSkills = restore('mbr_skill', chkSkill, true);
      persist('mbr_skill', chkSkill);
      chkSkill.addEventListener('change', function (e) {
        window.options.useSkills = e.target.checked;
        window.roulette.setWinningRank(window.options.winningRank);
      });

      var chkChar = document.querySelector('#chkCharacters');
      window.roulette.setUseCharacters(restore('mbr_char', chkChar, true));
      persist('mbr_char', chkChar);
      chkChar.addEventListener('change', function (e) {
        window.roulette.setUseCharacters(e.target.checked);
      });

      var chkBg = document.querySelector('#chkBackground');
      window.roulette.setBackgroundEnabled(restore('mbr_bg', chkBg, true));
      persist('mbr_bg', chkBg);
      chkBg.addEventListener('change', function (e) {
        window.roulette.setBackgroundEnabled(e.target.checked);
      });

      var chkRec = document.querySelector('#chkAutoRecording');
      window.options.autoRecording = restore('mbr_rec', chkRec, false);
      window.roulette.setAutoRecording(window.options.autoRecording);
      persist('mbr_rec', chkRec);
      chkRec.addEventListener('change', function (e) {
        window.options.autoRecording = e.target.checked;
        window.roulette.setAutoRecording(e.target.checked);
      });

      var chkDark = document.querySelector('#chkDarkMode');
      applyTheme(restore('mbr_dark', chkDark, true));
      chkDark.addEventListener('change', function (e) { applyTheme(e.target.checked); });

      // ── 이벤트 ────────────────────────────────────────
      window.roulette.addEventListener('goal', function () {
        ready = false;
        setTimeout(function () {
          document.querySelector('#settings').classList.remove('hide');
        }, 3000);
      });
      window.roulette.addEventListener('message', function (e) { simpleToast(e.detail); });

      getReady();
    }

    document.addEventListener('DOMContentLoaded', initialize);
  })();
</script>
